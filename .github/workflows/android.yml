# Builds Wave for Sonos.
#  - push to main / pull request: checks + test APK (arm64 only, debug-signed) as workflow artifact
#  - tag "v<version>" (e.g. v1.0.1): checks + signed universal APK + GitHub release
#
# Release signing needs these repository secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64    base64 of credentials/release.keystore
#   KEYSTORE_PASSWORD  store password
#   KEY_ALIAS          key alias (waveforsonos)
#   KEY_PASSWORD       key password

name: Android build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci

  build:
    name: ${{ startsWith(github.ref, 'refs/tags/v') && 'Release APK' || 'Test APK' }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Read version
        id: version
        run: |
          echo "name=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"
          echo "code=$(node -p "require('./app.json').expo.android.versionCode")" >> "$GITHUB_OUTPUT"

      - name: Check that the tag matches app.json
        if: env.IS_RELEASE == 'true'
        run: |
          if [ "v${{ steps.version.outputs.name }}" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app.json version ${{ steps.version.outputs.name }}"
            exit 1
          fi
          if [ ! -f "fastlane/metadata/android/en-US/changelogs/${{ steps.version.outputs.code }}.txt" ]; then
            echo "::error::Missing changelog fastlane/metadata/android/en-US/changelogs/${{ steps.version.outputs.code }}.txt"
            exit 1
          fi

      - name: Restore signing key
        if: env.IS_RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set – cannot sign the release"
            exit 1
          fi
          mkdir -p credentials
          echo "$KEYSTORE_BASE64" | base64 -d > credentials/release.keystore
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > credentials/keystore.properties

      - name: Generate native project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build APK
        working-directory: android
        run: |
          if [ "$IS_RELEASE" = "true" ]; then
            ./gradlew :app:assembleRelease --no-daemon
          else
            ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
          fi

      - name: Collect APK and checksum
        id: apk
        run: |
          if [ "$IS_RELEASE" = "true" ]; then
            NAME="wave-for-sonos-${{ steps.version.outputs.name }}.apk"
          else
            NAME="wave-for-sonos-${{ steps.version.outputs.name }}-${GITHUB_SHA::7}-arm64-test.apk"
          fi
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/$NAME"
          (cd dist && sha256sum "$NAME" > "$NAME.sha256")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Verify release signature
        if: env.IS_RELEASE == 'true'
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          CERTS="$("$APKSIGNER" verify --print-certs "dist/${{ steps.apk.outputs.name }}")"
          echo "$CERTS" | head -3
          if ! echo "$CERTS" | grep -q "CN=Wave for Sonos"; then
            echo "::error::APK is not signed with the release key"
            exit 1
          fi

      - name: Remove signing key
        if: always()
        run: rm -rf credentials

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/
          retention-days: ${{ env.IS_RELEASE == 'true' && 90 || 14 }}

      - name: Publish GitHub release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=${{ steps.version.outputs.code }}
          {
            echo "### What's new"
            cat "fastlane/metadata/android/en-US/changelogs/$CODE.txt"
            echo
            if [ -f "fastlane/metadata/android/de-DE/changelogs/$CODE.txt" ]; then
              echo "### Neu"
              cat "fastlane/metadata/android/de-DE/changelogs/$CODE.txt"
              echo
            fi
            echo "---"
            echo "Android 7.0+, all CPU types. Check the APK against the \`.sha256\` file."
            echo
            echo "Wave for Sonos is an independent project and is not affiliated with Sonos, Inc., YouTube or Google LLC."
          } > release-notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Wave for Sonos ${{ steps.version.outputs.name }}" \
            --notes-file release-notes.md \
            --verify-tag

  # Self-hosted F-Droid repository on GitHub Pages: https://kostkams.github.io/WaveForSonos/repo
  # Rebuilt from the last GitHub releases on every release tag.
  # Needs secrets FDROID_KEYSTORE_BASE64 + FDROID_KEYSTORE_PASS and Pages source "GitHub Actions".
  fdroid-repo:
    name: F-Droid repository
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}repo
    env:
      APP_ID: de.tetranova.waveforsonos
      REPO_URL: https://kostkams.github.io/WaveForSonos/repo
      # SHA-256 of the repo signing certificate (public; lets F-Droid verify the repo)
      REPO_FINGERPRINT: d8c5c5be6b6a6ffaf70427fe3e95e105518b10b8c3fd14625ef401ecdc42de83
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install fdroidserver
        run: pip install --quiet fdroidserver

      - name: Prepare repository
        env:
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$FDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret FDROID_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          mkdir -p site/fdroid/repo site/fdroid/metadata
          cd site/fdroid
          echo "$FDROID_KEYSTORE_BASE64" | base64 -d > keystore.p12
          cat > config.yml <<EOF
          repo_url: $REPO_URL
          repo_name: Wave for Sonos
          repo_description: >-
            Official repository of Wave for Sonos – play music, podcasts, playlists and local files
            from your Android phone on your Sonos speakers.
          repo_icon: icon.png
          archive_older: 0
          keystore: keystore.p12
          repo_keyalias: repokey
          keystorepass: "$FDROID_KEYSTORE_PASS"
          keypass: "$FDROID_KEYSTORE_PASS"
          keydname: CN=Wave for Sonos F-Droid repo, O=Tetranova, C=DE
          sdk_path: $ANDROID_HOME
          EOF
          chmod 600 config.yml keystore.p12
          # App metadata + localized texts, icon and changelogs from fastlane
          cp "$GITHUB_WORKSPACE/fdroid/metadata/$APP_ID.yml" metadata/
          mkdir -p "metadata/$APP_ID"
          cp -r "$GITHUB_WORKSPACE/fastlane/metadata/android/." "metadata/$APP_ID/"
          mkdir -p repo/icons
          cp "$GITHUB_WORKSPACE/fastlane/metadata/android/en-US/images/icon.png" repo/icons/icon.png
          # APKs of the last three releases
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 3 --json tagName --jq '.[].tagName'); do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir repo --skip-existing
          done
          ls -la repo

      - name: Build F-Droid index
        working-directory: site/fdroid
        run: |
          fdroid update --verbose
          rm -f keystore.p12 config.yml
          rm -rf tmp

      - name: Landing page
        run: |
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Wave for Sonos – F-Droid repository</title>
          <style>
            body { font-family: system-ui, sans-serif; max-width: 640px; margin: 48px auto; padding: 0 16px; line-height: 1.5; color: #231917; background: #FFF8F6; }
            code { background: #F1DFDA; padding: 2px 6px; border-radius: 6px; word-break: break-all; }
            a.button { display: inline-block; background: #8F4C38; color: #fff; padding: 12px 20px; border-radius: 24px; text-decoration: none; }
          </style>
          <h1>Wave for Sonos</h1>
          <p>Add this repository to the F-Droid app (or Neo Store / Droid-ify) to install Wave for Sonos and get updates automatically.</p>
          <p><a class="button" href="fdroidrepos://kostkams.github.io/WaveForSonos/repo?fingerprint=d8c5c5be6b6a6ffaf70427fe3e95e105518b10b8c3fd14625ef401ecdc42de83">Add to F-Droid</a></p>
          <p>Repository address:<br><code>https://kostkams.github.io/WaveForSonos/repo</code></p>
          <p>Fingerprint:<br><code>d8c5c5be6b6a6ffaf70427fe3e95e105518b10b8c3fd14625ef401ecdc42de83</code></p>
          <p>Source code, releases and the APK: <a href="https://github.com/kostkams/WaveForSonos">github.com/kostkams/WaveForSonos</a></p>
          </html>
          EOF
          touch site/.nojekyll
          # Serve the repo at /repo (not /fdroid/repo)
          mv site/fdroid/repo site/repo
          rm -rf site/fdroid

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
